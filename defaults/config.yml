use_ipv6: False # Использовать IPv6
wait_delete: 60 # Через сколько удалять сообщение .ад
battery_path: "/sys/class/power_supply/battery/status" # Путь к файлу с информацией о батарее

web:
  host: "127.0.0.1" # 0.0.0.0 — доступ по сети (HTTP не шифрует пароль!)
  port: 8080
  password: "luminto" # Смените перед публикацией панели

# Необязательно: api_id/api_hash приложения для QR-входа и новых клиентов.
# Если не заданы, панель берёт их из первого клиента в clients/.
telegram:
  api_id: 0
  api_hash: ""

# Не трогай это, если не знаешь! URL для API
url:
  geoapify: "https://api.geoapify.com/v1/geocode/reverse"
  openweathermap: "https://api.openweathermap.org/data/2.5/weather?q={city}&appid={apikey}&units=metric&lang=ru"
  fp: "https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text"
  exchangerate: "https://v6.exchangerate-api.com/v6/{token}/latest/{currency}"